<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Manual Trainer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap');

*, *::before, *::after {
box-sizing: border-box; margin: 0; padding: 0;
-webkit-user-select: none; user-select: none;
-webkit-tap-highlight-color: transparent;
touch-action: none;
}
html, body { width:100%; height:100%; overflow:hidden; background:#080a10; font-family:‘Share Tech Mono’,monospace; color:#b8bcd8; }

:root {
–accent:#f0a500; –red:#e03535; –green:#18b858; –blue:#2878e0;
–panel:rgba(8,10,18,0.84); –border:rgba(255,255,255,0.07); –dim:#3a3d58;
}

/* STREET VIEW */
#sv-wrap { position:fixed; inset:0; z-index:0; background:#111420; overflow:hidden; }
#sv-wrap iframe { width:100%; height:100%; border:none; pointer-events:none; opacity:0.5; transform:scale(1.06); }
#sv-grad { position:absolute; inset:0; background:linear-gradient(to bottom,rgba(8,10,18,.6) 0%,rgba(8,10,18,.05) 38%,rgba(8,10,18,.55) 72%,rgba(8,10,18,.97) 100%); }
#speed-vign { position:absolute; inset:0; background:radial-gradient(ellipse at center,transparent 35%,rgba(8,10,18,.65) 100%); opacity:0; transition:opacity .3s; pointer-events:none; }

/* LAYOUT */
#ui { position:fixed; inset:0; z-index:1; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); pointer-events:none; }
/* re-enable pointer events on all direct children except the layer itself */
#ui > * { pointer-events:auto; }

/* TOP BAR */
#top-bar { flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:8px 14px 6px; background:var(–panel); border-bottom:1px solid var(–border); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
#title { font-family:‘Orbitron’,monospace; font-size:11px; font-weight:900; color:var(–accent); letter-spacing:3px; }
#engine-pill { display:flex; align-items:center; gap:6px; font-size:10px; }
#elight { width:7px; height:7px; border-radius:50%; background:var(–red); box-shadow:0 0 5px var(–red); transition:all .25s; }
#elight.on { background:var(–green); box-shadow:0 0 8px var(–green); }

/* HINT — fixed height, no reflow */
#hint-bar { flex-shrink:0; height:34px; display:flex; align-items:center; justify-content:center; padding:0 14px; background:rgba(240,165,0,.07); border-bottom:1px solid rgba(240,165,0,.14); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); overflow:hidden; }
#hint-text { font-size:11px; color:var(–accent); letter-spacing:.4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%; text-align:center; transition:opacity .18s; }

/* GAUGES */
#gauges { flex-shrink:0; display:flex; gap:10px; padding:8px 12px 4px; justify-content:center; }
.g-card { flex:1; max-width:155px; background:var(–panel); border:1px solid var(–border); border-radius:14px; padding:7px 10px 5px; display:flex; flex-direction:column; align-items:center; gap:1px; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
.g-label { font-size:8px; letter-spacing:2px; color:var(–dim); text-transform:uppercase; }
.g-arc { width:100%; }
.g-arc svg { width:100%; display:block; overflow:visible; }
.g-val { font-family:‘Orbitron’,monospace; font-size:21px; font-weight:700; color:var(–accent); min-width:60px; text-align:center; line-height:1; }
.g-val.red { color:var(–red); }
.g-unit { font-size:8px; color:var(–dim); letter-spacing:1px; }

/* GEAR + BITE */
#mid-row {
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:4px 12px;
}
#gear-strip {
  display:flex;
  flex-direction:row;
  margin-left:auto;

  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}
.gb { width:38px; height:32px; display:flex; align-items:center; justify-content:center; font-family:‘Orbitron’,monospace; font-size:12px; font-weight:700; color:var(–dim); border:none; background:transparent; border-right:1px solid var(–border); cursor:pointer; transition:all .12s; }
.gb:last-child { border-right:none; }
.gb.act { background:var(–accent); color:#000; }
.gb[data-g=“0”].act { background:var(–blue); color:#fff; }
.gb[data-g=”-1”].act { background:var(–red); color:#fff; }

#bite-pill { display:flex; align-items:center; gap:6px; background:var(–panel); border:1px solid var(–border); border-radius:10px; padding:6px 12px; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
#bdot { width:8px; height:8px; border-radius:50%; border:2px solid var(–dim); transition:all .1s; }
#bdot.on { border-color:var(–accent); background:var(–accent); box-shadow:0 0 8px var(–accent); }
#bite-lbl { font-size:9px; color:var(–dim); letter-spacing:1px; white-space:nowrap; }

/* PEDALS */
#pedals { flex:1; min-height:0; display:flex; gap:8px; padding:6px 12px 8px; }
.pu { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; }
.pu-name { font-size:8px; letter-spacing:2px; color:var(–dim); text-transform:uppercase; }
.pu-pct  { font-size:11px; color:#8890b0; min-width:36px; text-align:center; }
.track { flex:1; width:100%; min-height:100px; background:var(–panel); border:1px solid var(–border); border-radius:20px; position:relative; overflow:hidden; cursor:pointer; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); pointer-events:auto;}
.fill { position:absolute; bottom:0; left:0; right:0; border-radius:20px; }
#cf { background:linear-gradient(to top,#2020b0,#6060ff); }
#bf { background:linear-gradient(to top,#800,var(–red)); }
#gf { background:linear-gradient(to top,#073,var(–green)); }
.thumb { position:absolute; left:50%; transform:translateX(-50%); width:calc(100% - 8px); height:28px; background:linear-gradient(180deg,#3a3d55,#22243a); border:1px solid #505070; border-radius:14px; box-shadow:0 2px 8px rgba(0,0,0,.6); }
.thumb::after { content:’’; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:22px; height:2px; background:#606080; border-radius:2px; box-shadow:0 -5px 0 #606080, 0 5px 0 #606080; }
.tick { position:absolute; right:0; width:6px; height:1px; background:var(–accent); opacity:.5; }
.pu-icon { font-size:18px; }

/* START BUTTON — above everything, always clickable */
#start-btn {
position:fixed;
bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
left:50%; transform:translateX(-50%);
z-index:9999;
pointer-events:auto;
background:var(–accent); color:#000;
border:none; border-radius:14px;
padding:13px 38px;
font-family:‘Orbitron’,monospace; font-size:13px; font-weight:900; letter-spacing:3px;
box-shadow:0 0 28px rgba(240,165,0,.4);
cursor:pointer; display:none;
}
</style>

<button id="start-btn">ЗАПУСТИТЬ</button>

<script>
// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
const S = {
  engineOn:false, stall:false, isBiting:false,
  rpm:0, speed:0, gear:0,
  clutch:0, brake:0, gas:0,
  lastT:null,
};

const IDLE=800, STALL_RPM=420, MAX_RPM=7000, REDLINE=6000;
const G_RATIO = {'-1':8, 1:10, 2:20, 3:32, 4:46, 5:65};
const BITE_LO=0.28, BITE_HI=0.48;

const $=id=>document.getElementById(id);
const elight=$('elight'), etext=$('etext'), hintEl=$('hint-text');
const rpmEl=$('rpm-val'), spdEl=$('spd-val');
const startBtn=$('start-btn');
const bdot=$('bdot'), biteLbl=$('bite-lbl');
const speedVign=$('speed-vign');

// ═══════════════════════════════════════════
//  WEB AUDIO — engine sound + Taptic-style haptic
// ═══════════════════════════════════════════
let AC=null, osc1=null, osc2=null, gainEng=null, gainRumble=null, rumble=null;

function initAudio(){
  if(AC) return;
  AC = new (window.AudioContext||window.webkitAudioContext)();

  const shaper = AC.createWaveShaper();
  shaper.curve = distCurve(100); shaper.oversample='2x';
  const lpf = AC.createBiquadFilter();
  lpf.type='lowpass'; lpf.frequency.value=700; lpf.Q.value=1.2;
  gainEng = AC.createGain(); gainEng.gain.value=0;

  osc1 = AC.createOscillator(); osc1.type='sawtooth'; osc1.frequency.value=55;
  osc2 = AC.createOscillator(); osc2.type='sawtooth'; osc2.frequency.value=57;
  osc1.connect(shaper); osc2.connect(shaper);
  shaper.connect(lpf); lpf.connect(gainEng); gainEng.connect(AC.destination);

  rumble = AC.createOscillator(); rumble.type='sine'; rumble.frequency.value=26;
  gainRumble = AC.createGain(); gainRumble.gain.value=0;
  rumble.connect(gainRumble); gainRumble.connect(AC.destination);

  osc1.start(); osc2.start(); rumble.start();
}

function distCurve(k){
  const n=256, c=new Float32Array(n);
  for(let i=0;i<n;i++){const x=(2*i/n)-1; c[i]=((Math.PI+k)*x)/(Math.PI+k*Math.abs(x));}
  return c;
}

function soundEngine(rpm, on){
  if(!AC) return;
  const t=AC.currentTime;
  if(on){
    const f=42+(rpm/MAX_RPM)*240;
    osc1.frequency.setTargetAtTime(f,t,.05);
    osc2.frequency.setTargetAtTime(f*1.032,t,.05);
    gainEng.gain.setTargetAtTime(0.16+(rpm/MAX_RPM)*0.24,t,.04);
    gainRumble.gain.setTargetAtTime(0.07,t,.1);
  } else {
    gainEng.gain.setTargetAtTime(0,t,.35);
    gainRumble.gain.setTargetAtTime(0,t,.25);
  }
}

function soundStall(){
  if(!AC) return;
  const t=AC.currentTime;
  osc1.frequency.setTargetAtTime(18,t,.18);
  osc2.frequency.setTargetAtTime(18,t,.18);
  gainEng.gain.setTargetAtTime(0,t,.45);
  gainRumble.gain.setTargetAtTime(0,t,.2);
}

// Haptic "thunk" — low-freq burst that iPhone feels through the speaker/body.
// Also fires navigator.vibrate as fallback where supported.
function hapticPulse(strength){
  // Web Audio burst: short envelope of ~50-80Hz sine
  if(AC){
    const dur = strength === 'heavy' ? 0.08 : strength === 'medium' ? 0.05 : 0.03;
    const freq = strength === 'heavy' ? 48 : 62;
    const amp  = strength === 'heavy' ? 0.7 : strength === 'medium' ? 0.45 : 0.25;

    const o = AC.createOscillator(); o.type='sine'; o.frequency.value=freq;
    const g = AC.createGain();
    g.gain.setValueAtTime(0, AC.currentTime);
    g.gain.linearRampToValueAtTime(amp, AC.currentTime+0.008);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+dur+0.01);
  }
  // Vibration API fallback
  if(navigator.vibrate){
    const ms = strength==='heavy'?40:strength==='medium'?20:10;
    navigator.vibrate(ms);
  }
}

// Bite: rhythmic tapping sensation during clutch slip zone
let biteInterval=null;
function startBiteHaptic(){
  if(biteInterval) return;
  biteInterval = setInterval(()=>hapticPulse('light'), 110);
}
function stopBiteHaptic(){
  if(biteInterval){ clearInterval(biteInterval); biteInterval=null; }
}

function soundBite(){
  if(!AC) return;
  const sr=AC.sampleRate;
  const buf=AC.createBuffer(1,Math.floor(sr*.055),sr);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(sr*.011));
  const s=AC.createBufferSource(); s.buffer=buf;
  const g=AC.createGain(); g.gain.value=0.3;
  s.connect(g); g.connect(AC.destination); s.start();
  hapticPulse('medium');
}

// ═══════════════════════════════════════════
//  PEDALS — spring-return, clutch locks at 100%
// ═══════════════════════════════════════════
const P = {
  clutch:{val:0,target:0,active:false,tid:null,locked:false},
  brake: {val:0,target:0,active:false,tid:null},
  gas:   {val:0,target:0,active:false,tid:null},
};

function setupPedal(trackId, key, onChange){
  const track=$(trackId);
  const p=P[key];
  function pct(cy){ const r=track.getBoundingClientRect(); return Math.max(0,Math.min(1,1-(cy-r.top)/r.height)); }

  track.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(p.tid!==null) return;
    initAudio(); if(AC&&AC.state==='suspended') AC.resume();
    // Touching clutch again cancels lock
    if(key==='clutch'&&p.locked) p.locked=false;
    const t=e.changedTouches[0]; p.tid=t.identifier; p.active=true;
    p.val=p.target=pct(t.clientY); onChange(p.val);
  },{passive:false});

  window.addEventListener('touchmove',e=>{
    if(p.tid===null) return;
    for(const t of e.changedTouches){
      if(t.identifier===p.tid){ p.val=p.target=pct(t.clientY); onChange(p.val); break; }
    }
  },{passive:true});

  function end(e){
    for(const t of e.changedTouches){
      if(t.identifier===p.tid){
        if(key==='clutch'&&p.val>=0.98){
          p.locked=true; p.val=1; p.target=1;
        } else {
          p.locked=false; p.target=0;
        }
        p.tid=null; p.active=false;
        break;
      }
    }
  }
  window.addEventListener('touchend',end);
  window.addEventListener('touchcancel',end);

  // Mouse
  track.addEventListener('mousedown',e=>{
    initAudio();
    if(key==='clutch'&&p.locked) p.locked=false;
    p.active=true; p.val=p.target=pct(e.clientY); onChange(p.val);
  });
  window.addEventListener('mousemove',e=>{ if(!p.active)return; p.val=p.target=pct(e.clientY); onChange(p.val); });
  window.addEventListener('mouseup',()=>{
    if(!p.active) return;
    if(key==='clutch'&&p.val>=0.98){ p.locked=true; p.val=1; p.target=1; }
    else { p.locked=false; p.target=0; }
    p.active=false;
  });
}

function pedalUI(fId,tId,pId,v){
  const p=v*100;
  $(fId).style.height=p+'%';
  $(tId).style.bottom=`calc(${p}% - 14px)`;
  $(pId).textContent=Math.round(p)+'%';
}

setupPedal('c-track','clutch',v=>{ S.clutch=v; pedalUI('cf','c-thumb','c-pct',v); checkStart(); });
setupPedal('b-track','brake', v=>{ S.brake=v;  pedalUI('bf','b-thumb','b-pct',v); });
setupPedal('g-track','gas',   v=>{ S.gas=v;    pedalUI('gf','g-thumb','g-pct',v); });

function tickPedals(dt){
  const K=10;
  for(const [key,p] of Object.entries(P)){
    if(p.active||p.locked) continue;
    const d=p.target-p.val;
    p.val=Math.abs(d)<.003?p.target:p.val+d*Math.min(K*dt,1);
    S[key]=p.val;
    if(key==='clutch'){ pedalUI('cf','c-thumb','c-pct',p.val); checkStart(); }
    else if(key==='brake') pedalUI('bf','b-thumb','b-pct',p.val);
    else pedalUI('gf','g-thumb','g-pct',p.val);
  }
}

// ═══════════════════════════════════════════
//  GEARS — allowed whenever clutch ≥ 65% pressed
// ═══════════════════════════════════════════
document.querySelectorAll('.gb').forEach(btn=>{
  btn.addEventListener('pointerdown',()=>{
    const g=parseInt(btn.dataset.g);
    // Block only if engine on, clutch NOT pressed enough, and not in stall
    if(S.engineOn&&!S.stall&&S.clutch<0.65){
      flashHint('⚠️ Выжми сцепление!'); hapticPulse('heavy'); return;
    }
    S.gear=g;
    document.querySelectorAll('.gb').forEach(b=>b.classList.remove('act'));
    btn.classList.add('act');
    hapticPulse('medium');
  });
});

// ═══════════════════════════════════════════
//  START — shown when clutch locked at 100% + gear=N
// ═══════════════════════════════════════════
function checkStart(){
  // Show start if: clutch >= 78% pressed, gear N, engine off
  const show = S.clutch>=0.78 && S.gear===0 && !S.engineOn;
  startBtn.style.display = show ? 'block' : 'none';
}

startBtn.addEventListener('pointerdown',()=>{
  initAudio(); if(AC&&AC.state==='suspended') AC.resume();
  S.engineOn=true; S.stall=false; S.rpm=IDLE;
  elight.classList.add('on'); etext.textContent='ВКЛ';
  startBtn.style.display='none';
  hapticPulse('heavy');
  flashHint('✅ Запущен! Включи 1-ю и плавно отпускай сцепление');
});

// ═══════════════════════════════════════════
//  HINTS
// ═══════════════════════════════════════════
let hintTimer=null, persHint=null;
const H={
  off:   'Выжми сцепление → N → ЗАПУСТИТЬ',
  stall: '💀 Заглох! Сцепление + N → ЗАПУСТИТЬ',
  bite:  '🔥 Схватывание — держи, добавь газ!',
  up:    '⬆ Пора переключить вверх',
  down:  '⬇ Переключи вниз или добавь газ',
  brake: 'Тормоз — выжми сцепление!',
  go:    'Разгоняйся! При 3000 переключай вверх',
  idle:  'Двигатель работает — включай передачу',
};
function flashHint(msg,ms=2800){
  persHint=msg; fadeHint(msg);
  if(hintTimer) clearTimeout(hintTimer);
  hintTimer=setTimeout(()=>{ persHint=null; },ms);
}
function fadeHint(msg){
  if(hintEl.textContent===msg) return;
  hintEl.style.opacity='0';
  setTimeout(()=>{ hintEl.textContent=msg; hintEl.style.opacity='1'; },160);
}
function updateHint(){
  if(persHint) return;
  let m;
  if(!S.engineOn&&S.stall)                              m=H.stall;
  else if(!S.engineOn)                                  m=H.off;
  else if(S.isBiting)                                   m=H.bite;
  else if(S.speed>3&&S.brake>0.2&&S.clutch<0.5)        m=H.brake;
  else if(S.gear>0&&S.rpm>3400&&S.clutch<0.3)          m=H.up;
  else if(S.gear>1&&S.rpm<1100&&S.speed>4&&S.clutch<0.3) m=H.down;
  else if(S.speed>2)                                    m=H.go;
  else                                                  m=H.idle;
  fadeHint(m);
}

// ═══════════════════════════════════════════
//  GAUGE ARC + NEEDLE
//  viewBox 0 0 120 70 | center(60,64) | r=54
//  Arc: from -168° to -12° (sweep 156°)
//  Needle: rotated via rotate(angle,60,64) — Safari-safe
// ═══════════════════════════════════════════
const ARC_START=-168, ARC_SWEEP=156;
const CX=60, CY=64, R_ARC=54;

function setArc(arcId, ndlId, val, max){
  const t=Math.max(0,Math.min(1,val/max));
  const rad=d=>d*Math.PI/180;
  const s=ARC_START, sweep=ARC_SWEEP;
  const sx=CX+R_ARC*Math.cos(rad(s)), sy=CY+R_ARC*Math.sin(rad(s));
  const ea=s+t*sweep;
  const ex=CX+R_ARC*Math.cos(rad(ea)), ey=CY+R_ARC*Math.sin(rad(ea));
  const arc=$(arcId);
  if(t<0.004){
    // Degenerate arc: just a point (avoids rendering glitch)
    arc.setAttribute('d',`M${sx.toFixed(2)},${sy.toFixed(2)} A${R_ARC},${R_ARC} 0 0,1 ${(sx+0.01).toFixed(2)},${sy.toFixed(2)}`);
  } else {
    const lg=t*sweep>180?1:0;
    arc.setAttribute('d',`M${sx.toFixed(2)},${sy.toFixed(2)} A${R_ARC},${R_ARC} 0 ${lg},1 ${ex.toFixed(2)},${ey.toFixed(2)}`);
  }
  // Needle: rotate around center point — the only Safari-safe way
  $(ndlId).setAttribute('transform',`rotate(${(s+t*sweep).toFixed(2)},${CX},${CY})`);
}

// Set initial needle positions (pointing to -168° = left end of arc)
setArc('rpm-arc','rpm-ndl',0,MAX_RPM);
setArc('spd-arc','spd-ndl',0,200);

// ═══════════════════════════════════════════
//  PHYSICS LOOP
// ═══════════════════════════════════════════
let prevBite=false;

function loop(ts){
  if(!S.lastT) S.lastT=ts;
  const dt=Math.min((ts-S.lastT)/1000,.05);
  S.lastT=ts;

  tickPedals(dt);

  if(S.engineOn){
    const rel=1-S.clutch;
    const bite=rel>=BITE_LO&&rel<=BITE_HI;
    const engaged=rel>BITE_HI;
    S.isBiting=bite;

    let tgtRPM=IDLE+S.gas*(MAX_RPM-IDLE);

    if(S.gear!==0&&engaged){
      const ratio=G_RATIO[S.gear]||G_RATIO[1];
      const wRPM=(S.speed/ratio)*1000;
      const load=Math.max(0,1-S.speed/(ratio*6));
      tgtRPM=Math.max(IDLE,wRPM+S.gas*1800*load);
      const pull=(S.rpm-wRPM*.4)/900;
      S.speed=Math.max(0,S.speed+(pull*7-S.brake*55-S.speed*.35)*dt);
      if(S.rpm<STALL_RPM&&S.speed<1.5){
        S.engineOn=false; S.stall=true; S.rpm=0;
        elight.classList.remove('on'); etext.textContent='ЗАГЛОХ';
        soundStall(); hapticPulse('heavy');
        stopBiteHaptic();
      }
    } else if(S.gear!==0&&bite){
      const slip=(rel-BITE_LO)/(BITE_HI-BITE_LO);
      S.speed=Math.max(0,S.speed+(slip*(S.gas*5+1.5)-S.brake*40-S.speed*.4)*dt);
      tgtRPM=Math.max(IDLE,IDLE+S.gas*1800-slip*400);
    } else {
      S.speed=Math.max(0,S.speed-(S.brake*75+S.speed*.25)*dt);
    }

    S.rpm+=(tgtRPM-S.rpm)*Math.min((engaged?700:1800)*dt,1);
    S.rpm=Math.max(0,Math.min(MAX_RPM,S.rpm));

    if(bite&&!prevBite){ soundBite(); startBiteHaptic(); }
    if(!bite&&prevBite){ stopBiteHaptic(); }
    prevBite=bite;
    soundEngine(S.rpm,true);

  } else {
    S.speed=Math.max(0,S.speed-12*dt);
    S.rpm=Math.max(0,S.rpm-600*dt);
    soundEngine(S.rpm,false);
    if(!prevBite){ stopBiteHaptic(); }
    prevBite=false; S.isBiting=false;
    if(S.stall&&S.clutch>0.72&&S.gear===0){
      etext.textContent='ВЫКЛ'; checkStart();
    }
  }

  // UI
  rpmEl.textContent=Math.round(S.rpm/100);
  rpmEl.className='g-val'+(S.rpm>REDLINE?' red':'');
  spdEl.textContent=Math.round(S.speed);

  setArc('rpm-arc','rpm-ndl',S.rpm,MAX_RPM);
  setArc('spd-arc','spd-ndl',S.speed,200);

  bdot.className=S.isBiting?'on':'';
  biteLbl.textContent=S.isBiting?'🔥СХВАТ':'СХВАТ.';
  speedVign.style.opacity=Math.min(S.speed/80,.7).toFixed(2);

  updateHint();
  if(!S.engineOn&&!S.stall) checkStart();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
