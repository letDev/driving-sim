<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Manual Trainer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap');

*, *::before, *::after {
box-sizing: border-box; margin: 0; padding: 0;
-webkit-user-select: none; user-select: none;
-webkit-tap-highlight-color: transparent;
}

.track {
  touch-action: none;
}

.thumb,
.fill {
  pointer-events: none;
}
html, body { width:100%; height:100%; overflow:hidden; background:#080a10; 
font-family:'Share Tech Mono', monospace; color:#b8bcd8; }

:root {
--accent:#f0a500; --red:#e03535; --green:#18b858; --blue:#2878e0;
--panel:rgba(8,10,18,0.84); --border:rgba(255,255,255,0.07); --dim:#3a3d58;
}

/* STREET VIEW */
#sv-wrap { position:fixed; inset:0; z-index:0; background:#111420; overflow:hidden; }
#sv-wrap iframe { width:100%; height:100%; border:none; pointer-events:none; opacity:0.5; transform:scale(1.06); }
#sv-grad { position:absolute; inset:0; background:linear-gradient(to bottom,rgba(8,10,18,.6) 0%,rgba(8,10,18,.05) 38%,rgba(8,10,18,.55) 72%,rgba(8,10,18,.97) 100%); }
#speed-vign { position:absolute; inset:0; background:radial-gradient(ellipse at center,transparent 35%,rgba(8,10,18,.65) 100%); opacity:0; transition:opacity .3s; pointer-events:none; }

/* LAYOUT */
#ui { position:fixed; inset:0; z-index:1; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); pointer-events:none; }
/* re-enable pointer events on all direct children except the layer itself */
#ui > * { pointer-events:auto; }

/* TOP BAR */
#top-bar { flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:8px 14px 6px; background:var(--panel); border-bottom:1px solid var(--border); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
#title { font-family:'Orbitron',monospace; font-size:11px; font-weight:900; color:var(--accent); letter-spacing:3px; }
#engine-pill { display:flex; align-items:center; gap:6px; font-size:10px; }
#elight { width:7px; height:7px; border-radius:50%; background:var(--red); box-shadow:0 0 5px var(--red); transition:all .25s; }
#elight.on { background:var(--green); box-shadow:0 0 8px var(--green); }

/* HINT — fixed height, no reflow */
#hint-bar { flex-shrink:0; height:34px; display:flex; align-items:center; justify-content:center; padding:0 14px; background:rgba(240,165,0,.07); border-bottom:1px solid rgba(240,165,0,.14); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); overflow:hidden; }
#hint-text { font-size:11px; color:var(--accent); letter-spacing:.4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%; text-align:center; transition:opacity .18s; }

/* GAUGES */
#gauges { flex-shrink:0; display:flex; gap:10px; padding:8px 12px 4px; justify-content:center; }
.g-card { flex:1; max-width:155px; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:7px 10px 5px; display:flex; flex-direction:column; align-items:center; gap:1px; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
.g-label { font-size:8px; letter-spacing:2px; color:var(--dim); text-transform:uppercase; }
.g-arc { width:100%; }
.g-arc svg { width:100%; display:block; overflow:visible; }
.g-val { font-family:'Orbitron',monospace; font-size:21px; font-weight:700; color:var(--accent); min-width:60px; text-align:center; line-height:1; }
.g-val.red { color:var(--red); }
.g-unit { font-size:8px; color:var(--dim); letter-spacing:1px; }

/* GEAR + BITE */
#gear-column {
  width:64px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
}

#gear-strip {
  display:flex;
  flex-direction:column;
  gap:6px;
}

.gb {
  width:54px;
  height:42px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-family:'Orbitron',monospace;
  font-size:14px;
  font-weight:700;

  color:var(--dim);

  border:none;
  border-radius:12px;

  background:var(--panel);
  border:1px solid var(--border);

  cursor:pointer;
  transition:all .12s;

  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}

.gb.act {
  background:var(--accent);
  color:#000;
}

.gb[data-g="0"].act {
  background:var(--blue);
  color:#fff;
}

.gb[data-g="-1"].act {
  background:var(--red);
  color:#fff;
}
#bite-pill { display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:6px 12px; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
#bdot { width:8px; height:8px; border-radius:50%; border:2px solid var(--dim); transition:all .1s; }
#bdot.on { border-color:var(--accent); background:var(--accent); box-shadow:0 0 8px var(--accent); }
#bite-lbl { font-size:9px; color:var(--dim); letter-spacing:1px; white-space:nowrap; }

#bite-pill.active {
  border-color: var(--accent);
}

#bite-pill.active #bdot {
  border-color: var(--accent);
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent);
}

#bite-pill.active #bite-lbl {
  color: var(--accent);
}

/* PEDALS */
#pedals {
  flex:1;
  min-height:0;
  display:flex;
  gap:8px;
  padding:6px 12px 8px;
  align-items:stretch;
}
#gear-strip-vertical {
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:6px;

  margin-left:6px;
}

#gear-strip-vertical .gb {
  width:54px;
  height:42px;

  border:none;
  border-radius:12px;

  background:var(--panel);
  border:1px solid var(--border);

  color:var(--dim);

  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}

#gear-strip-vertical .gb.act {
  background:var(--accent);
  color:#000;
}

#gear-strip-vertical .gb[data-g="0"].act {
  background:var(--blue);
  color:#fff;
}

#gear-strip-vertical .gb[data-g="-1"].act {
  background:var(--red);
  color:#fff;
}
.pu { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; }
.pu-name { font-size:8px; letter-spacing:2px; color:var(--dim); text-transform:uppercase; }
.pu-pct  { font-size:11px; color:#8890b0; min-width:36px; text-align:center; }
.track { flex:1; width:100%; min-height:100px; background:var(--panel); border:1px solid var(--border); border-radius:20px; position:relative; overflow:hidden; cursor:pointer; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); pointer-events:auto;}
.fill { position:absolute; bottom:0; left:0; right:0; border-radius:20px; }
#cf { background:linear-gradient(to top,#2020b0,#6060ff); }
#bf { background:linear-gradient(to top,#800,var(--red)); }
#gf { background:linear-gradient(to top,#073,var(--green)); }
.thumb { position:absolute; left:50%; transform:translateX(-50%); width:calc(100% - 8px); height:28px; background:linear-gradient(180deg,#3a3d55,#22243a); border:1px solid #505070; border-radius:14px; box-shadow:0 2px 8px rgba(0,0,0,.6); }
.thumb::after { content:’’; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:22px; height:2px; background:#606080; border-radius:2px; box-shadow:0 -5px 0 #606080, 0 5px 0 #606080; }
.tick { position:absolute; right:0; width:6px; height:1px; background:var(--accent); opacity:.5; }
.pu-icon { font-size:18px; }

/* START BUTTON — above everything, always clickable */
#start-btn {
position:fixed;
bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
left:50%; transform:translateX(-50%);
z-index:9999;
pointer-events:auto;
background:var(--accent); color:#000;
border:none; border-radius:14px;
padding:13px 38px;
font-family:'Orbitron',monospace; font-size:13px; font-weight:900; letter-spacing:3px;
box-shadow:0 0 28px rgba(240,165,0,.4);
cursor:pointer; display:none;
}
</style>

</head>
<body>

<div id="sv-wrap">
  <iframe src="https://www.google.com/maps/embed?pb=!4v1700000000000!6m8!1m7!1sCAoSLEFGMVFpcE9QNHpQbUxYbXV5NHJ5dGJHNFVJOFZsZkJ5ZUoxNE9wWFpPdzBv!2m2!1d35.6595!2d139.7004!3f160!4f5!5f0.7820865974627469" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
  <div id="sv-grad"></div>
  <div id="speed-vign"></div>
</div>

<div id="ui">
  <div id="top-bar">
    <div id="title">MANUAL TRAINER</div>
    <div id="engine-pill"><div id="elight"></div><span id="etext">ВЫКЛ</span></div>
  </div>

  <div id="hint-bar"><div id="hint-text">Выжми сцепление → N → ЗАПУСТИТЬ</div></div>

  <div id="gauges">
    <!-- RPM gauge. viewBox 120×70, center(60,64), r=54, arc -168°→-12° -->
    <div class="g-card">
      <div class="g-label">об / мин</div>
      <div class="g-arc">
        <svg viewBox="0 0 120 70">
          <!-- bg track -->
          <path d="M7.2,52.8 A54,54 0 1,1 112.8,52.8" fill="none" stroke="#181b2c" stroke-width="9" stroke-linecap="round"/>
          <!-- redline zone (last ~20%) -->
          <path d="M96.4,18.2 A54,54 0 0,1 112.8,52.8" fill="none" stroke="#380a0a" stroke-width="9" stroke-linecap="round"/>
          <!-- live arc -->
          <path id="rpm-arc" d="M7.2,52.8 A54,54 0 0,1 7.3,52.7" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round"/>
          <!-- needle — NO transform-origin attr; rotated purely via JS setAttribute -->
          <line id="rpm-ndl" x1="60" y1="64" x2="60" y2="14" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="60" cy="64" r="4" fill="var(--accent)"/>
        </svg>
      </div>
      <div class="g-val" id="rpm-val">0</div>
      <div class="g-unit">RPM × 100</div>
    </div>

<!-- Speed gauge -->
<div class="g-card">
  <div class="g-label">скорость</div>
  <div class="g-arc">
    <svg viewBox="0 0 120 70">
      <path d="M7.2,52.8 A54,54 0 1,1 112.8,52.8" fill="none" stroke="#181b2c" stroke-width="9" stroke-linecap="round"/>
      <path id="spd-arc" d="M7.2,52.8 A54,54 0 0,1 7.3,52.7" fill="none" stroke="var(--blue)" stroke-width="7" stroke-linecap="round"/>
      <line id="spd-ndl" x1="60" y1="64" x2="60" y2="14" stroke="var(--blue)" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="60" cy="64" r="4" fill="var(--blue)"/>
    </svg>
  </div>
  <div class="g-val" id="spd-val">0</div>
  <div class="g-unit">КМ / Ч</div>
</div>

  </div>

  <div id="pedals">
    <div class="pu">
      <div class="pu-name">Сцепление</div>
      <div class="pu-pct" id="c-pct">0%</div>
      <div class="track" id="c-track">
        <div class="fill" id="cf" style="height:0%"></div>
        <div class="thumb" id="c-thumb" style="bottom:-14px"></div>
        <div class="tick" style="bottom:60%"></div>
        <div class="tick" style="bottom:65%"></div>
        <div class="tick" style="bottom:70%"></div>
      </div>
      <div class="pu-icon">🦶</div>
    </div>
    <div class="pu">
      <div class="pu-name">Тормоз</div>
      <div class="pu-pct" id="b-pct">0%</div>
      <div class="track" id="b-track">
        <div class="fill" id="bf" style="height:0%"></div>
        <div class="thumb" id="b-thumb" style="bottom:-14px"></div>
      </div>
      <div class="pu-icon">🛑</div>
    </div>
    <div class="pu">
      <div class="pu-name">Газ</div>
      <div class="pu-pct" id="g-pct">0%</div>
      <div class="track" id="g-track">
        <div class="fill" id="gf" style="height:0%"></div>
        <div class="thumb" id="g-thumb" style="bottom:-14px"></div>
      </div>
      <div class="pu-icon">⚡</div>
    </div>
    <div id="gear-column">
    <div id="gear-strip">
      <button class="gb" data-g="-1">R</button>
      <button class="gb act" data-g="0">N</button>
      <button class="gb" data-g="1">1</button>
      <button class="gb" data-g="2">2</button>
      <button class="gb" data-g="3">3</button>
      <button class="gb" data-g="4">4</button>
      <button class="gb" data-g="5">5</button>
    </div>
  
    <div id="bite-pill">
      <div id="bdot"></div>
      <div id="bite-lbl">СХВАТ</div>
    </div>
</div>
  </div>
</div>

<button id="start-btn">ЗАПУСТИТЬ</button>

<script>
// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
const S = {
  engineOn:false, stall:false, isBiting:false,
  rpm:0, speed:0, gear:0,
  clutch:0, brake:0, gas:0,
  lastT:null,
};

const IDLE=800, MAX_RPM=7000, REDLINE=6000;

const GEAR_RATIO = {
  '-1': -3.2,
  '1': 3.58,
  '2': 2.04,
  '3': 1.41,
  '4': 1.12,
  '5': 0.89
};

const FINAL_DRIVE = 4.1;

const WHEEL_RADIUS = 0.31;

const ENGINE_INERTIA = 0.22;

const VEHICLE_MASS = 1350;

const AIR_DRAG = 0.42;

const ROLLING_DRAG = 0.018;

const ENGINE_BRAKE = 0.045;

const CLUTCH_MAX_TORQUE = 420;

const IDLE_TORQUE = 80;

const MAX_ENGINE_TORQUE = 260;

const $=id=>document.getElementById(id);
function getClutchEngagement() {
  return 1 - S.clutch;
}

const elight=$('elight'), etext=$('etext'), hintEl=$('hint-text');
const rpmEl=$('rpm-val'), spdEl=$('spd-val');
const startBtn=$('start-btn');
const bdot=$('bdot'), biteLbl=$('bite-lbl');
const speedVign=$('speed-vign');

// ═══════════════════════════════════════════
//  WEB AUDIO — engine sound + haptics
//  Все узлы создаются один раз в initAudio().
//  В loop() только параметры меняются — никаких new OscillatorNode на каждый кадр.
// ═══════════════════════════════════════════
let AC = null;

// Постоянные узлы движка
let engFund=null, engFund2=null, engHarm=null;
let engGain=null, engLpf=null, engHpf=null;
let rumbleOsc=null, rumbleGain=null;
// Узел дрожания при схватывании (bite tremolo)
let biteOsc=null, biteTremoloGain=null, biteGain=null;
// Haptic — один переиспользуемый узел с gain=0 в покое
let hapticOsc=null, hapticGain=null;

function initAudio(){
  if(AC) return;
  AC = new (window.AudioContext||window.webkitAudioContext)();
  const dst = AC.destination;

  // --- ENGINE: 3 осциллятора (фундаментальный + детюн + гармоника) ---
  // Тип 'triangle' — мягче и теплее чем 'sawtooth'
  engFund  = AC.createOscillator(); engFund.type  = 'triangle'; engFund.frequency.value  = 55;
  engFund2 = AC.createOscillator(); engFund2.type = 'triangle'; engFund2.frequency.value = 56.5; // лёгкий хорус
  engHarm  = AC.createOscillator(); engHarm.type  = 'sine';     engHarm.frequency.value  = 110;  // 2-я гармоника

  // Лёгкий вейвшейпер для натуральной "теплоты" без агрессивного дисторшна
  const shaper = AC.createWaveShaper();
  shaper.curve = softDistCurve(18);
  shaper.oversample = '2x';

  // Фильтры
  engLpf = AC.createBiquadFilter(); engLpf.type='lowpass';  engLpf.frequency.value=900;  engLpf.Q.value=0.8;
  engHpf = AC.createBiquadFilter(); engHpf.type='highpass'; engHpf.frequency.value=60;   engHpf.Q.value=0.5;

  engGain = AC.createGain(); engGain.gain.value = 0;

  engFund.connect(shaper); engFund2.connect(shaper); engHarm.connect(shaper);
  shaper.connect(engHpf); engHpf.connect(engLpf); engLpf.connect(engGain); engGain.connect(dst);

  // --- RUMBLE: низкочастотный фон ---
  rumbleOsc  = AC.createOscillator(); rumbleOsc.type='sine'; rumbleOsc.frequency.value=28;
  rumbleGain = AC.createGain(); rumbleGain.gain.value=0;
  rumbleOsc.connect(rumbleGain); rumbleGain.connect(dst);

  // --- BITE TREMOLO: модуляция при схватывании ---
  // biteOsc модулирует biteGain — создаёт пульсирующий эффект вибрации двигателя
  biteOsc   = AC.createOscillator(); biteOsc.type='sine'; biteOsc.frequency.value=14;
  biteTremoloGain = AC.createGain(); biteTremoloGain.gain.value = 0; // глубина модуляции
  biteGain  = AC.createGain(); biteGain.gain.value = 0;
  // biteOsc → biteTremoloGain → engGain.gain (AudioParam)
  biteOsc.connect(biteTremoloGain);
  biteTremoloGain.connect(engGain.gain); // AM-модуляция поверх основного звука

  // --- HAPTIC: один постоянный осциллятор, gain=0 в покое ---
  hapticOsc  = AC.createOscillator(); hapticOsc.type='sine'; hapticOsc.frequency.value=55;
  hapticGain = AC.createGain(); hapticGain.gain.value=0;
  hapticOsc.connect(hapticGain); hapticGain.connect(dst);

  // Запуск всех постоянных узлов
  engFund.start(); engFund2.start(); engHarm.start();
  rumbleOsc.start(); biteOsc.start(); hapticOsc.start();
}

// Мягкий вейвшейпер — добавляет тепло, не режет слух
function softDistCurve(k){
  const n=512, c=new Float32Array(n);
  for(let i=0;i<n;i++){
    const x=(2*i/(n-1))-1;
    c[i] = x / (1 + k * Math.abs(x)) * (1 + k/8);
  }
  return c;
}

// Вызывается каждый кадр — только setTargetAtTime, никаких new узлов
function soundEngine(rpm, on){
  if(!AC) return;
  const t = AC.currentTime;
  if(on){
    // Частота: 40Гц на холостых → 220Гц на redline (более реалистичный диапазон)
    const f = 40 + (rpm / MAX_RPM) * 180;
    engFund.frequency.setTargetAtTime(f,        t, 0.06);
    engFund2.frequency.setTargetAtTime(f*1.028,  t, 0.06);
    engHarm.frequency.setTargetAtTime(f*2,       t, 0.06);

    // LPF открывается с оборотами — добавляет "воздух" на высоких
    engLpf.frequency.setTargetAtTime(500 + (rpm/MAX_RPM)*1800, t, 0.08);

    // Громкость: тише на холостых, нарастает с газом
    const vol = 0.10 + (rpm/MAX_RPM)*0.22;
    engGain.gain.setTargetAtTime(vol, t, 0.05);
    rumbleGain.gain.setTargetAtTime(0.055 + (rpm/MAX_RPM)*0.025, t, 0.08);

    // Bite tremolo — активируется в зоне схватывания через clutchHapticEngine
  } else {
    engGain.gain.setTargetAtTime(0,   t, 0.4);
    rumbleGain.gain.setTargetAtTime(0, t, 0.3);
    biteTremoloGain.gain.setTargetAtTime(0, t, 0.1);
  }
}

function soundStall(){
  if(!AC) return;
  const t = AC.currentTime;
  // Быстрое падение частоты вниз как настоящий глохнущий двигатель
  engFund.frequency.setTargetAtTime(22,  t, 0.12);
  engFund2.frequency.setTargetAtTime(22, t, 0.12);
  engHarm.frequency.setTargetAtTime(44,  t, 0.12);
  engGain.gain.setTargetAtTime(0,        t, 0.5);
  rumbleGain.gain.setTargetAtTime(0,     t, 0.3);
  biteTremoloGain.gain.setTargetAtTime(0,t, 0.05);
}

// Haptic через постоянный узел — никаких new OscillatorNode!
function hapticPulse(strength){
  if(AC){
    const t   = AC.currentTime;
    const amp = strength==='heavy' ? 0.65 : strength==='medium' ? 0.38 : 0.18;
    const dur = strength==='heavy' ? 0.07 : strength==='medium' ? 0.045 : 0.025;
    const freq= strength==='heavy' ? 46   : 60;
    hapticOsc.frequency.setValueAtTime(freq, t);
    hapticGain.gain.cancelScheduledValues(t);
    hapticGain.gain.setValueAtTime(0, t);
    hapticGain.gain.linearRampToValueAtTime(amp, t+0.007);
    hapticGain.gain.exponentialRampToValueAtTime(0.001, t+dur);
    hapticGain.gain.setValueAtTime(0, t+dur+0.002);
  }
  if(navigator.vibrate){
    const ms = strength==='heavy'?35:strength==='medium'?18:8;
    navigator.vibrate(ms);
  }
}

// ═══════════════════════════════════════
//  CLUTCH HAPTIC ENGINE — тоже без new узлов
//  Модулирует bite tremolo через biteTremoloGain
// ═══════════════════════════════════════

let lastHapticTime = 0;

function clutchHapticEngine(dt) {
  if (!AC || !S.engineOn) return;

  const now = performance.now();
  if (now - lastHapticTime < 50) return; // ~20Hz достаточно
  lastHapticTime = now;

  const eng = getClutchEngagement();
  const inBite = eng > 0.15 && eng < 0.85;

  if(!inBite){
    biteTremoloGain.gain.setTargetAtTime(0, AC.currentTime, 0.08);
    return;
  }

  // Интенсивность нарастает к центру зоны схватывания (eng≈0.5)
  const biteFactor = Math.max(0, 1 - Math.abs(eng - 0.5)*2.2);
  const rpmFactor  = Math.min(S.rpm / 5000, 1);
  const intensity  = biteFactor * 0.9 + rpmFactor * 0.1;

  if(intensity < 0.05){
    biteTremoloGain.gain.setTargetAtTime(0, AC.currentTime, 0.1);
    return;
  }

  // Частота тремоло растёт с оборотами — реалистичная тряска
  biteOsc.frequency.setTargetAtTime(10 + S.rpm/300, AC.currentTime, 0.05);
  // Глубина модуляции
  biteTremoloGain.gain.setTargetAtTime(intensity * 0.06, AC.currentTime, 0.04);

  if(navigator.vibrate && intensity > 0.4){
    navigator.vibrate(Math.floor(intensity * 8));
  }
}


// ═══════════════════════════════════════════
//  PEDALS — spring-return, clutch locks at 100%
// ═══════════════════════════════════════════
const P = {
  clutch:{val:0,target:0,active:false,tid:null},
  brake: {val:0,target:0,active:false,tid:null},
  gas:   {val:0,target:0,active:false,tid:null},
};

function setupPedal(trackId, key, onChange){
  const track=$(trackId);
  const p=P[key];
  function pct(cy){ const r=track.getBoundingClientRect(); return Math.max(0,Math.min(1,1-(cy-r.top)/r.height)); }

  track.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(p.tid!==null) return;
    initAudio(); if(AC&&AC.state==='suspended') AC.resume();
    const t=e.changedTouches[0]; p.tid=t.identifier; p.active=true;
    p.val=p.target=pct(t.clientY); onChange(p.val);
  },{passive:false});

  window.addEventListener('touchmove',e=>{
    if(p.tid===null) return;
    for(const t of e.changedTouches){
      if(t.identifier===p.tid){ p.val=p.target=pct(t.clientY); onChange(p.val); break; }
    }
  },{passive:true});

  function end(e){
    for(const t of e.changedTouches){
      if(t.identifier===p.tid){
        p.target=0;
        p.tid=null; p.active=false;
        break;
      }
    }
  }
  window.addEventListener('touchend',end);
  window.addEventListener('touchcancel',end);

  // Mouse
  track.addEventListener('mousedown',e=>{
    initAudio();
    p.active=true; p.val=p.target=pct(e.clientY); onChange(p.val);
  });
  window.addEventListener('mousemove',e=>{ if(!p.active)return; p.val=p.target=pct(e.clientY); onChange(p.val); });
  window.addEventListener('mouseup',()=>{
    if(!p.active) return;
    p.target=0;
    p.active=false;
  });
}

function pedalUI(fId,tId,pId,v){
  const p=v*100;
  $(fId).style.height=p+'%';
  $(tId).style.bottom=`calc(${p}% - 14px)`;
  $(pId).textContent=Math.round(p)+'%';
}

setupPedal('c-track','clutch',v=>{ S.clutch=v; pedalUI('cf','c-thumb','c-pct',v); checkStart(); });
setupPedal('b-track','brake', v=>{ S.brake=v;  pedalUI('bf','b-thumb','b-pct',v); });
setupPedal('g-track','gas',   v=>{ S.gas=v;    pedalUI('gf','g-thumb','g-pct',v); });

function tickPedals(dt){
  const K=10;
  for(const [key,p] of Object.entries(P)){
    if(p.active) continue;
    const d=p.target-p.val;
    p.val=Math.abs(d)<.003?p.target:p.val+d*Math.min(K*dt,1);
    S[key]=p.val;
    if(key==='clutch'){ pedalUI('cf','c-thumb','c-pct',p.val); checkStart(); }
    else if(key==='brake') pedalUI('bf','b-thumb','b-pct',p.val);
    else pedalUI('gf','g-thumb','g-pct',p.val);
  }
}

// ═══════════════════════════════════════════
//  GEARS — allowed whenever clutch ≥ 65% pressed
// ═══════════════════════════════════════════
document.querySelectorAll('.gb').forEach(btn=>{
  btn.addEventListener('pointerdown',()=>{
    const g=parseInt(btn.dataset.g);
    // Block only if engine on, clutch NOT pressed enough, and not in stall
    if (
      S.engineOn &&
      getClutchEngagement() > 0.75 &&
      S.gear !== 0
    ){
      flashHint('⚠️ Хруст синхронизаторов');
    
      hapticPulse('heavy');
    
      S.rpm -= 250;
    }
    S.gear=g;
    document.querySelectorAll('.gb').forEach(b=>b.classList.remove('act'));
    btn.classList.add('act');
    hapticPulse('medium');
  });
});

// ═══════════════════════════════════════════
//  START — shown when clutch locked at 100% + gear=N
// ═══════════════════════════════════════════
function checkStart(){
  // Show start if: clutch >= 78% pressed, gear N, engine off
  const show = S.clutch>=0.78 && S.gear===0 && !S.engineOn;
  startBtn.style.display = show ? 'block' : 'none';
}

startBtn.addEventListener('pointerdown',()=>{
  initAudio(); if(AC&&AC.state==='suspended') AC.resume();
  S.engineOn=true;
  S.stall=false;
  S.rpm=200;
  const startAnim = setInterval(() => {

    S.rpm += 140;
  
    if (S.rpm >= IDLE) {
      S.rpm = IDLE;
      clearInterval(startAnim);
    }
  
  }, 30);
  elight.classList.add('on'); etext.textContent='ВКЛ';
  startBtn.style.display='none';
  hapticPulse('heavy');
  flashHint('✅ Запущен! Включи 1-ю и плавно отпускай сцепление');
});

// ═══════════════════════════════════════════
//  HINTS
// ═══════════════════════════════════════════
let hintTimer=null, persHint=null;
const H={
  off:   'Выжми сцепление → N → ЗАПУСТИТЬ',
  stall: '💀 Заглох! Сцепление + N → ЗАПУСТИТЬ',
  bite:  '🔥 Схватывание — держи, добавь газ!',
  up:    '⬆ Пора переключить вверх',
  down:  '⬇ Переключи вниз или добавь газ',
  brake: 'Тормоз — выжми сцепление!',
  go:    'Разгоняйся! При 3000 переключай вверх',
  idle:  'Двигатель работает — включай передачу',
};
function flashHint(msg,ms=2800){
  persHint=msg; fadeHint(msg);
  if(hintTimer) clearTimeout(hintTimer);
  hintTimer=setTimeout(()=>{ persHint=null; },ms);
}
function fadeHint(msg){
  if(hintEl.textContent===msg) return;
  hintEl.style.opacity='0';
  setTimeout(()=>{ hintEl.textContent=msg; hintEl.style.opacity='1'; },160);
}
function updateHint(){
  if(persHint) return;
  let m;
  if(!S.engineOn&&S.stall)                              m=H.stall;
  else if(!S.engineOn)                                  m=H.off;
  else if(S.isBiting)                                   m=H.bite;
  else if(S.speed>3&&S.brake>0.2&&S.clutch<0.5)        m=H.brake;
  else if(S.gear>0&&S.rpm>3400&&S.clutch<0.3)          m=H.up;
  else if(S.gear>1&&S.rpm<1100&&S.speed>4&&S.clutch<0.3) m=H.down;
  else if(S.speed>2)                                    m=H.go;
  else                                                  m=H.idle;
  fadeHint(m);
}

function updateBiteUI(){
  const el = document.getElementById('bite-pill');
  if(S.isBiting){
    el.classList.add('active');
  } else {
    el.classList.remove('active');
  }
}

// ═══════════════════════════════════════════
//  GAUGE ARC + NEEDLE
//  viewBox 0 0 120 70 | center(60,64) | r=54
//  Arc: from -168° to -12° (sweep 156°)
//  Needle: rotated via rotate(angle,60,64) — Safari-safe
// ═══════════════════════════════════════════
const ARC_START=-168, ARC_SWEEP=156;
const CX=60, CY=64, R_ARC=54;

function setArc(arcId, ndlId, val, max){
  const t=Math.max(0,Math.min(1,val/max));
  const rad=d=>d*Math.PI/180;
  const s=ARC_START, sweep=ARC_SWEEP;
  const sx=CX+R_ARC*Math.cos(rad(s)), sy=CY+R_ARC*Math.sin(rad(s));
  const ea=s+t*sweep;
  const ex=CX+R_ARC*Math.cos(rad(ea)), ey=CY+R_ARC*Math.sin(rad(ea));
  const arc=$(arcId);
  if(t<0.004){
    // Degenerate arc: just a point (avoids rendering glitch)
    arc.setAttribute('d',`M${sx.toFixed(2)},${sy.toFixed(2)} A${R_ARC},${R_ARC} 0 0,1 ${(sx+0.01).toFixed(2)},${sy.toFixed(2)}`);
  } else {
    const lg=t*sweep>180?1:0;
    arc.setAttribute('d',`M${sx.toFixed(2)},${sy.toFixed(2)} A${R_ARC},${R_ARC} 0 ${lg},1 ${ex.toFixed(2)},${ey.toFixed(2)}`);
  }
  // Needle: rotate around center point — the only Safari-safe way
  $(ndlId).setAttribute('transform',`rotate(${(s+t*sweep).toFixed(2)},${CX},${CY})`);
}

// Set initial needle positions (pointing to -168° = left end of arc)
setArc('rpm-arc','rpm-ndl',0,MAX_RPM);
setArc('spd-arc','spd-ndl',0,200);

// ═══════════════════════════════════════════
//  PHYSICS LOOP
// ═══════════════════════════════════════════

let lastClutch = 0;

let throttleSmoothing = 0;

function loop(ts){
  if(!S.lastT) S.lastT=ts;
  const dt=Math.min((ts-S.lastT)/1000,.05);
  S.lastT=ts;

  tickPedals(dt);
  const clutchVelocity =
  (S.clutch - lastClutch) / dt;

  lastClutch = S.clutch;
  
  throttleSmoothing +=
  (S.gas - throttleSmoothing)
  * dt * 4;

    if (S.engineOn) {
    
      const gearRatio =
        S.gear === 0
          ? 0
          : GEAR_RATIO[String(S.gear)] * FINAL_DRIVE;
    
      const clutchEngagement = getClutchEngagement();
    
      // RPM колес
      const wheelAngular =
        S.speed / 3.6 / WHEEL_RADIUS;
    
      const wheelRPM =
        wheelAngular * 60 / (Math.PI * 2);
    
      // RPM коробки
      const gearboxRPM =
        Math.abs(gearRatio) > 0
          ? wheelRPM * Math.abs(gearRatio)
          : 0;
    
      // ===== ENGINE TORQUE =====
    
      const throttleTorque =
        IDLE_TORQUE +
        throttleSmoothing * MAX_ENGINE_TORQUE;
    
      // torque curve
      const powerBand =
        1 - Math.abs(S.rpm - 4200) / 4200;
    
      const engineTorque =
        throttleTorque *
        Math.max(0.35, powerBand);
    
      // ===== CLUTCH SLIP =====
    
      const rpmDifference =
        S.rpm - gearboxRPM;
    
      if (
        clutchVelocity < -4 &&
        Math.abs(rpmDifference) > 1800
      ) {
        hapticPulse('heavy');
        S.rpm -= 350;
        flashHint('⚠️ Резко бросил сцепление');
      }

      // Резкий бросок сцепления на высоких оборотах при трогании → заглохание
      if (
        clutchVelocity < -6 &&
        S.speed < 4 &&
        S.gear > 0 &&
        clutchEngagement > 0.6
      ) {
        S.rpm -= 600 * dt * 60;
        flashHint('⚠️ Плавнее отпускай сцепление!');
      }

      // Трогание на высокой передаче без газа → быстро глохнет
      if (
        S.gear >= 3 &&
        S.speed < 3 &&
        clutchEngagement > 0.5 &&
        throttleSmoothing < 0.08
      ) {
        S.rpm -= 400 * dt;
      }
    
      const clutchTorque =
        Math.max(
          -CLUTCH_MAX_TORQUE,
          Math.min(
            CLUTCH_MAX_TORQUE,
            rpmDifference * clutchEngagement * 0.22
          )
        );
    
      // ===== ENGINE RPM =====
    
      const engineResistance =
        S.rpm * ENGINE_BRAKE;
    
      const rpmAccel =
        (
          engineTorque
          - clutchTorque
          - engineResistance
        ) / ENGINE_INERTIA;
    
      S.rpm += rpmAccel * dt;
    
      // idle control
      if (throttleSmoothing < 0.05 && S.rpm < IDLE) {
        S.rpm += 1800 * dt;
      }
      
      if (
        S.rpm < 700 &&
        throttleSmoothing < 0.05
      ) {
        S.rpm += 1200 * dt;
      }
    
      // ===== STALL =====

      // Глохнет если: RPM упали слишком низко при включённой передаче и сцеплении
      const canStall =
        S.gear !== 0 &&
        clutchEngagement > 0.75 &&
        S.speed < 8;

      // Также глохнет при резком броске сцепления в покое
      const stallFromJerk =
        S.gear !== 0 &&
        S.speed < 2 &&
        clutchVelocity < -8 &&
        clutchEngagement > 0.5;

      if ((S.rpm < 520 && canStall) || (stallFromJerk && S.rpm < 1200)) {
    
        S.engineOn = false;
        S.stall = true;
    
        S.rpm = 0;
    
        elight.classList.remove('on');
        etext.textContent='ЗАГЛОХ';
    
        soundStall();
        hapticPulse('heavy');
    
        flashHint('💀 Заглох');
      }
    
      // ===== VEHICLE =====
    
      if (gearRatio !== 0) {
    
        const driveForce =
          clutchTorque *
          gearRatio /
          WHEEL_RADIUS;
    
        const brakeForce =
          S.brake * 9000;
    
        const dragForce =
          S.speed * S.speed * AIR_DRAG;
    
        const rolling =
          ROLLING_DRAG * VEHICLE_MASS;
    
        const accel =
          (
            driveForce
            - brakeForce
            - dragForce
            - rolling
          ) / VEHICLE_MASS;
    
        S.speed += accel * dt * 3.6;
    
        if (S.speed < 0) {
          S.speed = 0;
          }
          if (
        S.gear === 1 &&
        clutchEngagement > 0.4 &&
        throttleSmoothing < 0.05
      ) {
        S.speed += 0.8 * dt;
      }
      }
      else {
    
        // neutral roll
        const brakeForce =
          S.brake * 9000;
    
        const dragForce =
          S.speed * S.speed * AIR_DRAG;
    
        const rolling =
          ROLLING_DRAG * VEHICLE_MASS;
    
        const accel =
          (
            - brakeForce
            - dragForce
            - rolling
          ) / VEHICLE_MASS;
    
        S.speed += accel * dt * 3.6;
    
        if (S.speed < 0)
          S.speed = 0;
      }
    
      // ===== REV LIMITER =====
    
      if (S.rpm > MAX_RPM) {
        S.rpm = MAX_RPM;
      }
    
      // ===== BITE POINT =====
    
      S.isBiting =
        clutchEngagement > 0.15 &&
        clutchEngagement < 0.85 &&
        Math.abs(rpmDifference) > 250;
    
      // ===== ENGINE SHAKE =====
    
      if (
        S.isBiting &&
        Math.abs(rpmDifference) > 1200
      ) {
        hapticPulse('light');
      }
    
      // ===== SOUND =====
    
      soundEngine(S.rpm, true);

  } else {
    S.speed=Math.max(0,S.speed-12*dt);
    S.rpm=Math.max(0,S.rpm-600*dt);
    soundEngine(S.rpm,false);
    
    S.isBiting=false;
    if (
      S.stall &&
      S.clutch > 0.78 &&
      S.gear === 0
    ) {
      etext.textContent='ВЫКЛ'; checkStart();
    }
  }

  // UI
  rpmEl.textContent=Math.round(S.rpm/100);
  rpmEl.className='g-val'+(S.rpm>REDLINE?' red':'');
  spdEl.textContent=Math.round(S.speed);

  setArc('rpm-arc','rpm-ndl',S.rpm,MAX_RPM);
  setArc('spd-arc','spd-ndl',S.speed,200);

  bdot.className=S.isBiting?'on':'';
  speedVign.style.opacity=Math.min(S.speed/80,.7).toFixed(2);

  updateHint();
  updateBiteUI();
  if(!S.engineOn&&!S.stall) checkStart();

  requestAnimationFrame(loop);
  clutchHapticEngine(dt);
}

requestAnimationFrame(loop);
</script>
